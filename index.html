<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><title>Donna</title>
<style>html,body{margin:0;height:100%;background:#000;display:flex;align-items:center;justify-content:center}button{width:70vmin;height:70vmin;border-radius:50%;border:0;background:#ff6a00;color:#000;font:900 50vmin system-ui;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.95)}</style></head>
<body><button id="b">!</button><script>
function voice(){const v=speechSynthesis.getVoices();return v.find(x=>/ralph|fred|daniel|arthur|gordon|aaron/i.test(x.name)&&/^en/.test(x.lang))||v.find(x=>/^en/.test(x.lang));}
b.onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance("DONNA!");const v=voice();if(v)u.voice=v;u.pitch=0.3;u.rate=0.85;u.volume=1;speechSynthesis.speak(u);};
speechSynthesis.onvoiceschanged=voice;</script></body></html>
